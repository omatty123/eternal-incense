<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151b18">
  <meta name="description" content="Eternal Incense — 영원한 향. A personal space for remembrance.">
  <title>Eternal Incense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="images/environment/hall.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#memorials">Skip to memorials</a>
  <main id="hall" class="room hall-room" aria-label="Memorial hall">
    <div class="room-stage" aria-hidden="true"></div>
    <header class="site-identity">
      <h1>Eternal Incense</h1>
      <p lang="ko">영원한 향</p>
    </header>
    <section class="shelf-position" aria-label="Memorial photographs">
      <button class="shelf-edge shelf-prev" aria-label="Previous memorial photographs" aria-controls="memorials"></button>
      <div id="memorials" class="memorial-shelf" tabindex="0" aria-label="Memorial shelf. Scroll to see more photographs."></div>
      <button class="shelf-edge shelf-next" aria-label="More memorial photographs" aria-controls="memorials"></button>
    </section>
    <div id="shared-incense" class="shared-incense"></div>
    <section id="next-ceremony" class="upcoming-strip" aria-label="Upcoming observances"></section>
  </main>
  <main id="detail-page" class="room memorial-room hidden" aria-label="Individual memorial"></main>
  <footer class="quiet-tools">
    <button id="prayer-open" class="text-button" aria-label="Prayer book · 기도표" aria-haspopup="dialog"><span lang="ko">기도표</span><span class="tool-translation">Prayer book</span></button>
    <button id="care-open" class="text-button" aria-haspopup="dialog">Tend this space</button>
  </footer>

  <dialog id="prayer-drawer" class="drawer" aria-labelledby="prayer-heading">
    <button class="close-dialog" data-close aria-label="Close prayer book">×</button>
    <h2 id="prayer-heading"><span lang="ko">기도표</span> <span class="muted">Prayer book</span></h2>
    <div id="prayer-list" class="prayer-list"></div>
    <button id="add-prayer-btn" class="text-button">Add an intention</button>
    <form id="prayer-form-container" class="prayer-form hidden">
      <label for="prayer-category">Intention</label>
      <input type="text" id="prayer-category" required>
      <label for="prayer-detail">Detail</label>
      <input type="text" id="prayer-detail">
      <div class="form-actions">
        <button type="button" id="prayer-cancel" class="btn-secondary">Cancel</button>
        <button id="prayer-save" class="btn-primary">Add</button>
      </div>
    </form>
  </dialog>

  <dialog id="care-drawer" class="drawer" aria-labelledby="care-heading">
    <button class="close-dialog" data-close aria-label="Close memorial management">×</button>
    <h2 id="care-heading">Tend this space</h2>
    <div class="care-actions">
      <button id="add-btn" class="text-button">Add a memorial</button>
      <button id="calendar-btn" class="text-button">Add all observances to calendar</button>
    </div>
    <div id="management-list"></div>
    <details class="hidden-memorials"><summary>Hidden memorials</summary><div id="hidden-list"></div></details>
  </dialog>

  <dialog id="modal" class="form-dialog" aria-labelledby="modal-title">
    <button class="close-dialog" data-close aria-label="Close memorial form">×</button>
    <h2 id="modal-title">Add a Loved One</h2>
    <form id="memorial-form">
      <div class="form-group"><label for="input-name">Name</label><input type="text" id="input-name" required placeholder="Their name"></div>
      <div class="form-group"><label for="input-date">Date of passing</label><input type="date" id="input-date" required></div>
      <div class="form-group"><label for="input-photo">Photograph</label><input type="file" id="input-photo" accept="image/*"><img id="photo-preview" class="hidden" alt="Selected photograph preview"></div>
      <p id="form-error" role="alert"></p>
      <div class="form-actions"><button type="button" id="cancel-btn" class="btn-secondary">Cancel</button><button type="submit" class="btn-primary">Save</button></div>
    </form>
  </dialog>

  <dialog id="observance-dialog" class="observance-dialog" aria-labelledby="observance-title">
    <button class="close-dialog" data-close aria-label="Close observance">×</button>
    <div id="observance-body"></div>
  </dialog>
  <dialog id="remembrance-drawer" class="drawer" aria-labelledby="remembrance-heading">
    <button class="close-dialog" data-close aria-label="Close remembrance details">×</button>
    <div id="remembrance-body"></div>
  </dialog>
  <div id="status-message" class="sr-only" role="status" aria-live="polite"></div>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
